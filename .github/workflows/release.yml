name: release

# A version tag (vX.Y.Z) builds both instruments everywhere and attaches them to a GitHub Release. A manual run builds
# the same files and publishes nothing unless dry_run is turned off, so they can be downloaded from the run's page and
# tried first.
#
# Two files a platform, one an instrument — each its app and its plugins:
#   • macOS   → Orbit<Bass|Guitar>CabBuilder-<ver>-macOS.pkg: the app, VST3, AU, CLAP; signed, notarized, stapled;
#               one for Apple silicon and Intel  [self-hosted]
#   • Windows → Orbit<Bass|Guitar>CabBuilder-<ver>-Windows-<x64|arm64>.exe: the app, VST3, CLAP (Inno Setup)
#   • Linux   → Orbit<Bass|Guitar>CabBuilder-<ver>-Linux-<x86_64|arm64>.tar.gz: the app, VST3, CLAP
# The site files each page's downloads by that prefix and sorts them by those exact platform words: keep them as they are.
#
# Signing: the org's secrets MACOS_APP_IDENTITY, MACOS_INSTALLER_IDENTITY and KCH_PWD, and its variable NOTARY_PROFILE.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.1.0 (manual runs)"
        required: true
        default: "0.2.0"
      dry_run:
        description: "Build only — do NOT create a GitHub Release"
        type: boolean
        default: true

permissions:
  contents: write   # create the GitHub Release and upload its files

jobs:
  version:
    # The tag and the version the apps show (project() in CMakeLists.txt) are one number, or nothing is built.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          RAW="${{ github.event.inputs.version || github.ref_name }}"
          VER="${RAW#v}"
          OWN=$(sed -n 's/^project(cab_ir_generator VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "$VER" != "$OWN" ]; then
            echo "::error::the tag says $VER, CMakeLists.txt says $OWN"; exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

  macos:
    # Only the runner labelled `signing` holds the Developer ID certificates and the notary profile;
    # on any other the job dies at `security unlock-keychain`, which reads like a bad KCH_PWD.
    needs: version
    runs-on: [self-hosted, macOS, signing]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" \
            -DCABIR_JUCE_DIR= -DCABIR_CORE_DIR= -DCABIR_APPKIT_DIR= -DCABIR_TOML_DIR=
          cmake --build build --config Release --parallel 8
      - name: Test
        run: |
          ctest --test-dir build --output-on-failure
          ./build/presetcheck data/cabinets.txt data/presets/*.toml
          ./build/presetcheck data/guitar/cabinets.txt data/guitar/presets/*.toml
      - name: Sign, notarize, package
        env:
          APP_ID:  ${{ secrets.MACOS_APP_IDENTITY }}
          INST_ID: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          NOTARY:  ${{ vars.NOTARY_PROFILE }}
          KCH_PWD: ${{ secrets.KCH_PWD }}
        run: |
          set -euo pipefail
          export KEYCHAIN="$HOME/Library/Keychains/login.keychain-db"
          # The notary profile lives in the login keychain too (--keychain in the script), so it is found with the screen locked.
          security unlock-keychain -p "$KCH_PWD" "$KEYCHAIN"
          # The partition list is a precaution, refused on this host at times (SecKeychainItemSetAccessWithPassword) even
          # with the password that just unlocked the keychain — the key's ACL written in another security session; codesign
          # in the script is the real gate (as tabby-eq's release has it).
          if ! security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCH_PWD" "$KEYCHAIN" >/dev/null 2>&1; then
            echo "::warning::set-key-partition-list refused the keychain password (the unlock above succeeded); continuing — codesign is the gate"
          fi
          rm -rf dist
          installer/macos-release.sh build "${{ needs.version.outputs.version }}" dist
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*.pkg

  windows:
    # Each architecture built natively; what an installer takes staged for the job after (ISCC is x86, so the
    # installers are made on x64 for both).
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, arch: x64,   plat: x64   }
          - { runner: windows-11-arm, arch: arm64, plat: ARM64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          cmake -B build -A ${{ matrix.plat }} -DCMAKE_BUILD_TYPE=Release -DCABIR_JUCE_DIR= -DCABIR_CORE_DIR= -DCABIR_APPKIT_DIR= -DCABIR_TOML_DIR=
          cmake --build build --config Release --parallel
      - name: Test
        shell: bash
        run: |
          ctest --test-dir build -C Release --output-on-failure
          ./build/Release/presetcheck.exe data/cabinets.txt data/presets/*.toml
          ./build/Release/presetcheck.exe data/guitar/cabinets.txt data/guitar/presets/*.toml
      - name: Stage
        shell: bash
        run: |
          set -euo pipefail
          for inst in Bass Guitar; do
            name="Orbit $inst Cab Builder"
            plug="build/Orbit${inst}CabBuilderPlugin_artefacts/Release"
            s="stage/$inst"
            mkdir -p "$s/VST3" "$s/CLAP"
            cp "build/Orbit${inst}CabBuilder_artefacts/Release/$name.exe" LICENSE "$s/"
            cp -R "$plug/VST3/$name.vst3" "$s/VST3/"
            cp "$plug/CLAP/$name.clap" "$s/CLAP/"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: windows-stage-${{ matrix.arch }}
          path: stage/

  windows-installers:
    needs: [ version, windows ]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: windows-stage-*
          path: stage
      - name: Inno Setup
        shell: pwsh
        run: |
          # Inno Setup pinned, from its own releases: the script is written for 6, and choco's latest is 7 now, installed
          # somewhere else.
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe" -OutFile innosetup.exe
          Start-Process -Wait -FilePath .\innosetup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=C:\inno"
          $ver = "${{ needs.version.outputs.version }}"
          foreach ($arch in "x64", "arm64") {
            foreach ($inst in "Bass", "Guitar") {
              & "C:\inno\ISCC.exe" /Q "/DInstrument=$inst" "/DArch=$arch" "/DAppVersion=$ver" `
                  "/DSourceDir=$PWD\stage\windows-stage-$arch\$inst" installer\cabbuilder.iss
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          Get-ChildItem installer\output
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: installer/output/*.exe

  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: arm64  }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build \
            libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libglu1-mesa-dev mesa-common-dev
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCABIR_JUCE_DIR= -DCABIR_CORE_DIR= -DCABIR_APPKIT_DIR= -DCABIR_TOML_DIR=
          cmake --build build
      - name: Test
        run: |
          ctest --test-dir build --output-on-failure
          ./build/presetcheck data/cabinets.txt data/presets/*.toml
          ./build/presetcheck data/guitar/cabinets.txt data/guitar/presets/*.toml
      - name: Package (.tar.gz)
        run: |
          set -euo pipefail
          VER="${{ needs.version.outputs.version }}"
          mkdir -p dist
          for inst in Bass Guitar; do
            name="Orbit $inst Cab Builder"
            plug="build/Orbit${inst}CabBuilderPlugin_artefacts/Release"
            dir="Orbit${inst}CabBuilder-$VER"
            mkdir -p "stage/$dir"
            cp "build/Orbit${inst}CabBuilder_artefacts/Release/$name" LICENSE "stage/$dir/"
            cp installer/linux-INSTALL.txt "stage/$dir/INSTALL.txt"
            cp -R "$plug/VST3/$name.vst3" "stage/$dir/"
            cp "$plug/CLAP/$name.clap" "stage/$dir/"   # one file on Linux
            tar -C stage -czf "dist/$dir-Linux-${{ matrix.arch }}.tar.gz" "$dir"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  release:
    needs: [ version, macos, windows-installers, linux ]
    # A tag push publishes; a manual run only with dry_run off.
    if: ${{ github.event_name == 'push' || github.event.inputs.dry_run == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ needs.version.outputs.version }}"
          mkdir -p out
          find artifacts -type f -name 'Orbit*CabBuilder-*' -exec cp {} out/ \;
          ( cd out && sha256sum Orbit* > SHA256SUMS )
          gh release create "v$VER" \
            --repo "${{ github.repository }}" \
            --title "Orbit Bass Cab Builder and Orbit Guitar Cab Builder v$VER" \
            --generate-notes \
            out/*
