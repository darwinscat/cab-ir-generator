# THE TYPICAL CABINETS the site's page names, one per construction: a size, its back, its horn — each by how it is built,
# never by a maker's model. "With a horn" is -6 on every one, the attenuator's middle; "no horn" is off. Mics are not
# here: tools/cabpack spreads them as the presets' are (synth/PairSpread.h).

# 4x10
[[cab]]
id = "4x10-closed-horn"
box = "4x10"
back = "closed"
horn = "-6"

[[cab]]
id = "4x10-closed"
box = "4x10"
back = "closed"
horn = "off"

[[cab]]
id = "4x10-ported-horn"
box = "4x10"
back = "ported"
horn = "-6"

[[cab]]
id = "4x10-ported"
box = "4x10"
back = "ported"
horn = "off"

[[cab]]
id = "4x10-open"
box = "4x10"
back = "open"
horn = "off"

