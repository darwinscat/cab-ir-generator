# THE TYPICAL CABINETS the site's page names, one per construction: a size, its back, its horn. The page says what each
# is built like (darwinscat.com /felitronics/cab-ir-generator); these comments only say which line of the page it is.
# "With a horn" is -6 on every one, the attenuator's middle; "no horn" is off. Mics are not here: tools/cabpack puts A
# as DEFAULT's and B by the thorough FIND.

# 4x10
[[cab]]
id = "4x10-closed-horn"     # like Ampeg SVT-410HE
box = "4x10"
back = "closed"
horn = "-6"

[[cab]]
id = "4x10-closed"          # like Tech 21 B410
box = "4x10"
back = "closed"
horn = "off"

[[cab]]
id = "4x10-ported-horn"     # like Ampeg SVT-410HLF, Markbass Standard 104HF, Gallien-Krueger 410RBH, SWR Goliath III
box = "4x10"
back = "ported"
horn = "-6"

[[cab]]
id = "4x10-ported"          # like Hartke 410XL
box = "4x10"
back = "ported"
horn = "off"

[[cab]]
id = "4x10-open"            # like the tweed Fender Bassman 4x10
box = "4x10"
back = "open"
horn = "off"

