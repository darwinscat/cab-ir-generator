<!-- THE GENERATOR ON A PAGE, wired the plainest way — a reference for a page that does it its own way: the module's
     panel on a canvas (cabir-panel.mjs), the hand's moves into it, what it asks out — a state kept rendered full size, a
     moving one at half and only the last asked, FIND over workers (find-worker.mjs), DOWNLOAD IR as the app writes it, in a format its ▾ chooses —
     and the clock ticked only while something on it moves. Serve the folder (cabir.mjs, cabir.wasm, cabir-panel.mjs,
     find-worker.mjs, cabinets.txt, Michroma-web.woff2) and open demo.html. -->
<html><head><meta charset="utf-8"><title>Cab IR Generator</title>
<style>
@font-face { font-family: Michroma; src: url(Michroma-web.woff2) format('woff2'); }
html, body { margin: 0; background: #111119; }
canvas { display: block; width: 906px; height: 492px; touch-action: none; }
#format { position: absolute; display: none; background: #15151f; border: 1px solid #ff8a3d; border-radius: 4px; padding: 6px;
          font: 13px sans-serif; color: #ece9f6; }
</style></head>
<body><canvas id="panel"></canvas>
<div id="format">
  <select id="rate"><option value="44100">44.1 kHz</option><option value="48000" selected>48 kHz</option><option value="96000">96 kHz</option></select>
  <select id="bits"><option value="24" selected>24 bit</option><option value="16">16 bit</option></select>
  <select id="len"><option value="0" selected>full (100 ms)</option><option value="2048">2048 samples</option><option value="1024">1024 samples</option><option value="512">512 samples</option></select>
</div>
<script type="module">
import createCabir from './cabir.mjs';
import { PanelCanvas } from './cabir-panel.mjs';

const W = 906, H = 492, scale = Math.max (2, Math.ceil (devicePixelRatio));
await document.fonts.load ('20px Michroma');
const m = await createCabir ();
const call = (name, ret, types, args) => m.ccall (name, ret, types, args);
const canvas = document.getElementById ('panel');
canvas.width = W * scale; canvas.height = H * scale;
const ctx = canvas.getContext ('2d');
const panel = new PanelCanvas (m, ctx, { scale, onGlyphsReady: () => frame () });
const table = await (await fetch ('cabinets.txt')).text ();
call ('cabir_table', 'number', ['string'], [table]);

// THE STATE: the app's first, a 4x10 ported, an MD421 near the cap and a U47 at 12 cm.
let kept = `cabir = 1
box = "4x10-classic"
back = "ported"
horn = true
horn_db = 0
blend = 0.350
align = true
invert = false

[mic.a]
on = true
model = "md421"
x = -0.300
y = 0.000
distance = 0.050
angle = 0.0

[mic.b]
on = true
model = "u47"
x = -0.650
y = 0.000
distance = 0.120
angle = 0.0
`;

// The curve kept before the one playing, the band's grey ghost — copied into the module's heap to hand it over.
const points = call ('cabir_points', 'number', [], []);
const ghost = m._malloc (4 * points);
let hasGhost = false, keptCurve = null;

function render (state, live)
{
    if (call ('cabir_render', 'number', ['string', 'number'], [state, live ? 1 : 0]) === 0) return;
    const now = call ('cabir_response', 'number', [], []);
    const comb = call ('cabir_comb', 'number', [], []);
    if (keptCurve) { m.HEAPF32.set (keptCurve, ghost / 4); hasGhost = true; }
    call ('cabir_panel_response', null, ['number', 'number', 'number'], [now, hasGhost ? ghost : 0, comb]);
    if (! live) keptCurve = m.HEAPF32.slice (now / 4, now / 4 + points);
    frame ();
}

// FIND — and B just taken up — over workers: the places from C++, judged anywhere, the kept one picked by C++; with
// one mic heard that one's search, one round.
const workers = Array.from ({ length: Math.max (2, Math.min (8, (navigator.hardwareConcurrency || 4) - 1)) },
                            () => new Worker ('find-worker.mjs', { type: 'module' }));
workers.forEach ((w) => w.postMessage ({ table }));
let job = 0;

function judge (state, places, deadline)
{
    const n = places.length / 3, scores = new Float64Array (2 * n).fill (-1e30);
    for (let i = 0; i < n; ++i) scores[2 * i + 1] = 0;
    const id = ++job;
    return new Promise ((resolve) =>
    {
        // A place at a time to whichever worker is free, so the deadline stops the handing out at once; and once the
        // round is over a late answer is not drawn — a place drawn after the search ended would start its map again.
        let next = 0, busy = 0, open = true;
        const finish = () => { if (! open) return; open = false; clearTimeout (timer); resolve (scores); };
        const timer = deadline !== null ? setTimeout (finish, deadline) : 0;
        const give = (w) =>
        {
            if (! open || next >= n)
            {
                if (busy === 0) finish ();
                return;
            }
            const i = next++;
            ++busy;
            w.postMessage ({ job: id, toml: state, places: places.slice (3 * i, 3 * i + 3), first: i });
        };
        workers.forEach ((w) =>
        {
            w.onmessage = ({ data }) =>
            {
                if (data.job !== id) return;
                if (data.done) { --busy; give (w); return; }
                if (! open) return;
                scores[2 * data.index] = data.score;
                scores[2 * data.index + 1] = data.shift;
                call ('cabir_panel_search', null, ['number', 'number', 'number'], [data.x, data.y, data.score]);
                frame ();
            };
        });
        workers.forEach (give);
    });
}

async function find (state, thorough)
{
    const started = performance.now ();
    const heap = (scores) => { const at = m._malloc (scores.byteLength); m.HEAPF64.set (scores, at / 8); return at; };
    const n = call ('cabir_find_coarse', 'number', ['string'], [state]);
    const coarse = m.HEAPF32.slice (call ('cabir_find_places', 'number', [], []) / 4, call ('cabir_find_places', 'number', [], []) / 4 + 3 * n);
    const first = heap (await judge (state, coarse, null));
    const f = call ('cabir_find_fine', 'number', ['number', 'number'], [first, n]);
    let second = 0, count = 0;
    if (thorough && f > 0)
    {
        const fine = m.HEAPF32.slice (call ('cabir_find_places', 'number', [], []) / 4, call ('cabir_find_places', 'number', [], []) / 4 + 3 * f);
        second = heap (await judge (state, fine, Math.max (0, 2000 - (performance.now () - started))));
        count = f;
    }
    call ('cabir_find_best', 'number', ['number', 'number'], [second, count]);
    m._free (first); if (second) m._free (second);
    const at = call ('cabir_found', 'number', [], []) / 4, p = m.HEAPF32.subarray (at, at + 4);
    call ('cabir_panel_end_search', null, [], []);
    const placed = m.UTF8ToString (call ('cabir_with_found', 'number', ['string', 'number', 'number', 'number', 'number'], [state, p[0], p[1], p[2], p[3]]));
    keep (placed);
    call ('cabir_panel_show', 'number', ['string'], [placed]);
}

function keep (state)
{
    const bTakenUp = ! call ('cabir_b_on', 'number', ['string'], [kept]) && call ('cabir_b_on', 'number', ['string'], [state]);
    kept = state;
    render (state, false);
    if (bTakenUp) find (state, false);
}

// What the panel asks, as the app answers it.
let moving = null;
function pump ()
{
    for (let kind; (kind = call ('cabir_panel_event', 'number', [], [])) !== 0;)
    {
        const state = m.UTF8ToString (call ('cabir_panel_event_state', 'number', [], []));
        if (kind === 1) { moving = null; keep (state); }
        else if (kind === 2) moving = state;   // only the last asked is rendered
        else if (kind === 3) find (state, true);
        else if (kind === 4)
        {
            // In the format chosen, named as the app names it.
            const args = [kept, fmt.rate, fmt.bits, fmt.samples], types = ['string', 'number', 'number', 'number'];
            if (! call ('cabir_render_wav', 'number', types, args)) continue;
            const at = call ('cabir_wav', 'number', [], []), size = call ('cabir_wav_size', 'number', [], []);
            const a = document.createElement ('a');
            a.href = URL.createObjectURL (new Blob ([m.HEAPU8.slice (at, at + size)], { type: 'audio/wav' }));
            a.download = m.UTF8ToString (call ('cabir_download_name', 'number', types, args)) + '.wav';
            a.click ();
        }
        else if (kind === 5)
        {
            // The ▾: the page's own menu, under it.
            const r = call ('cabir_panel_format_rect', 'number', [], []) >> 2;
            const [x, y, w, h] = m.HEAPU32.slice (r, r + 4), b = canvas.getBoundingClientRect ();
            menu.style.display = 'block';
            menu.style.left = (b.left + (x + w) * b.width / W - menu.offsetWidth) + 'px';
            menu.style.top = (b.top + (y + h) * b.height / H + 4) + 'px';
        }
    }
    if (moving) { const s = moving; moving = null; render (s, true); }
}

// The hand, in the panel's units.
const at = (e) => { const r = canvas.getBoundingClientRect (); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; };
let down = false;
const hand = (kind, e) => { call ('cabir_panel_pointer', null, ['number', 'number', 'number'], [kind, ...at (e)]); pump (); frame (); };
canvas.addEventListener ('pointerdown', (e) => { down = true; canvas.setPointerCapture (e.pointerId); hand (1, e); });
canvas.addEventListener ('pointermove', (e) => hand (down ? 2 : 0, e));
canvas.addEventListener ('pointerup', (e) => { down = false; hand (3, e); });
canvas.addEventListener ('pointerleave', (e) => { if (! down) hand (4, e); });
canvas.addEventListener ('dblclick', (e) => hand (5, e));

// Drawn when it asks, ticked while something on it moves.
let queued = false;
function frame ()
{
    if (queued) return;
    queued = true;
    requestAnimationFrame (() =>
    {
        queued = false;
        call ('cabir_panel_tick', null, ['number'], [performance.now () / 1000]);
        if (call ('cabir_panel_dirty', 'number', [], []) || call ('cabir_panel_wants_frames', 'number', [], []))
        {
            ctx.setTransform (1, 0, 0, 1, 0, 0);
            ctx.fillStyle = '#111119';
            ctx.fillRect (0, 0, canvas.width, canvas.height);
            panel.paint ();
        }
        if (call ('cabir_panel_wants_frames', 'number', [], [])) frame ();
    });
}

// DOWNLOAD IR's format: its ▾ asks for the page's menu (event 5), the line under the button says what the next will be.
const fmt = { rate: 48000, bits: 24, samples: 0 };
const menu = document.getElementById ('format');
const said = () => call ('cabir_panel_download_note', null, ['string'],
                         [m.UTF8ToString (call ('cabir_download_note', 'number', ['number', 'number', 'number'], [fmt.rate, fmt.bits, fmt.samples]))]);
for (const id of ['rate', 'bits', 'len'])
    document.getElementById (id).addEventListener ('change', () =>
    {
        fmt.rate = +document.getElementById ('rate').value;
        fmt.bits = +document.getElementById ('bits').value;
        fmt.samples = +document.getElementById ('len').value;
        said ();
        menu.style.display = 'none';
        frame ();
    });
call ('cabir_panel_download_format', null, ['number'], [1]);
said ();

call ('cabir_panel_show', 'number', ['string'], [kept]);
render (kept, false);
document.title = 'Cab IR Generator — ready';
</script></body></html>
